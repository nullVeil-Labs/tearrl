[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tearrl"
version = "0.4.2"
description = "TearRL: Counterfactual Witness-Coupled Reinforcement Learning (TEARRL-0 v0.4.2-pilot-freeze)"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "scipy>=1.13"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["tearrl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-horizon property tests (10^6 trajectories, protocol S3.3 layer 4)",
]
addopts = "-q --strict-markers"
